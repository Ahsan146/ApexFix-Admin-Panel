name: apexfix_admin_panel
description: ApexFix professional service management admin panel.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: CascadiaCode
      fonts:
        - asset: assets/fonts/CascadiaCode-Regular.ttf
        - asset: assets/fonts/CascadiaCode-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CascadiaCode-Bold.ttf
          weight: 700
